<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Price Sentinel — dashboard redesign prototype</title>
<!--
  PROTOTYPE ONLY — not the live dashboard.

  The live dashboard is index.html, generated by dashboard.py on every run.
  This file is a static design reference built during the Aug 2026 session,
  using SAMPLE DATA, to decide how the real dashboard should look. It is not
  wired to data/ and nothing generates it.

  Live prototype:  https://bhanu-thakur.github.io/price-sentinel/prototype.html
  Live dashboard:  https://bhanu-thakur.github.io/price-sentinel/

  Design sources and rationale:
  - Apple Wallet / Revolut  -> collapsed card stack expanding to detail
                               (a watchlist is a scanning surface first)
  - Groww                   -> range selector + dotted reference lines for
                               all-time low and your target, so the chart
                               shows the gap you are waiting on
  - CRED                    -> dark premium surface, score as hero metric,
                               but deliberately WITHOUT the gamified ornament;
                               a page you check for a price drop should not
                               feel like a game
  - Tabular figures         -> non-negotiable. font-variant-numeric: tabular-nums
                               keeps Rs 3,359 and Rs 24,990 aligned instead of
                               jittering between refreshes.

  Key proposed change: the verdict line at the top ("1 product in the buy
  zone"). The dashboard's real job is answering "is there anything I should
  act on right now?" in under two seconds. The current live version makes you
  read every card to find out.

  Known open concerns before implementing:
  - The score meter is the weakest element. It is a number pretending to be a
    gauge; a sparkline in that space might inform more.
  - Expanding cards means chart data for EVERY product ships on page load. At
    75 products that is ~285 KB. Render charts lazily on expand instead.
-->
<style>
:root{--surface:#14171C;--surface2:#1B1F26;--line:#252A33;--txt:#E9ECF1;--dim:#8B93A1;
--dimmer:#5C6472;--go:#3FB950;--go-dim:#1E6E32;--warn:#D29922;--idle:#4B85D6}
*{box-sizing:border-box;margin:0}
body{background:#0F1116;font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
color:var(--txt);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;padding:26px;
max-width:940px;margin:0 auto}
.num{font-variant-numeric:tabular-nums;font-feature-settings:"tnum" 1}
.banner{background:#1B1F26;border:1px solid var(--line);border-left:3px solid var(--warn);
border-radius:8px;padding:11px 14px;font-size:12.5px;color:var(--dim);margin-bottom:22px}
.verdict{display:flex;align-items:baseline;gap:10px;padding:0 0 18px;border-bottom:1px solid var(--line);
margin-bottom:18px;flex-wrap:wrap}
.verdict h1{font-size:19px;font-weight:650;letter-spacing:-.01em}
.verdict .sub{color:var(--dim);font-size:12.5px}
.filters{display:flex;gap:6px;margin-bottom:16px;flex-wrap:wrap}
.chip{background:var(--surface);border:1px solid var(--line);color:var(--dim);padding:5px 12px;
border-radius:20px;font-size:12px;cursor:pointer;font-family:inherit;transition:.15s}
.chip:hover{border-color:#38404D;color:var(--txt)}
.chip.on{background:var(--txt);color:#0F1116;border-color:var(--txt);font-weight:550}
.cards{display:flex;flex-direction:column;gap:10px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;
transition:border-color .18s}
.card:hover{border-color:#38404D}
.card.go{border-color:var(--go-dim);background:linear-gradient(90deg,rgba(63,185,80,.05),transparent 42%)}
.head{display:grid;grid-template-columns:4px 1fr auto auto;gap:16px;align-items:center;
padding:15px 17px;cursor:pointer;user-select:none}
.rail{width:4px;height:38px;border-radius:3px;background:var(--dimmer)}
.card.go .rail{background:var(--go)}
.card.watch .rail{background:var(--warn)}
.nm{font-size:13.5px;font-weight:550;letter-spacing:-.005em}
.sub2{color:var(--dim);font-size:11.5px;margin-top:3px}
.pricewrap{text-align:right}
.price{font-size:23px;font-weight:680;letter-spacing:-.02em}
.card.go .price{color:var(--go)}
.delta{font-size:11.5px;color:var(--dim);margin-top:2px}
.meter{width:74px;text-align:center}
.bar{height:5px;background:#242932;border-radius:3px;overflow:hidden}
.fill{height:100%;border-radius:3px;background:var(--dimmer);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.card.go .fill{background:var(--go)}
.card.watch .fill{background:var(--warn)}
.mlabel{font-size:10px;color:var(--dimmer);margin-top:5px;letter-spacing:.055em;text-transform:uppercase}
.body{max-height:0;overflow:hidden;transition:max-height .34s cubic-bezier(.2,.8,.2,1)}
.card.open .body{max-height:560px}
.inner{padding:4px 17px 18px;border-top:1px solid var(--line);margin-top:2px}
.ranges{display:flex;gap:5px;margin:15px 0 12px}
.r{background:transparent;border:1px solid var(--line);color:var(--dim);padding:4px 11px;
border-radius:7px;font-size:11.5px;cursor:pointer;font-family:inherit}
.r.on{background:var(--surface2);color:var(--txt);border-color:#3A424F}
svg.chart{width:100%;height:132px;display:block;overflow:visible}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--line);
border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-top:15px}
.st{background:var(--surface2);padding:11px 13px}
.stl{font-size:10px;color:var(--dimmer);text-transform:uppercase;letter-spacing:.055em}
.stv{font-size:15px;font-weight:600;margin-top:4px;letter-spacing:-.01em}
.stv.go{color:var(--go)}
.why{margin-top:14px;display:flex;flex-direction:column;gap:7px}
.rsn{display:flex;gap:9px;align-items:flex-start;font-size:12.5px;color:#C3CAD6}
.dot{width:5px;height:5px;border-radius:50%;background:var(--go);margin-top:6px;flex:none}
.dot.w{background:var(--warn)}
.acts{display:flex;gap:9px;margin-top:16px}
.btn{flex:1;text-align:center;padding:9px;border-radius:9px;font-size:12.5px;font-weight:560;
cursor:pointer;border:1px solid var(--line);background:var(--surface2);color:var(--txt);font-family:inherit}
.btn.p{background:var(--go);border-color:var(--go);color:#08210E}
.foot{margin-top:16px;color:var(--dimmer);font-size:11px;text-align:center}
@media(max-width:600px){.head{grid-template-columns:4px 1fr auto;gap:11px}
.meter{display:none}.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="banner"><strong>Design prototype — sample data.</strong> The live dashboard is
<a href="./" style="color:#58a6ff">index.html</a>. Nothing generates this file.</div>
<div class="verdict"><h1>1 product in the buy zone</h1><span class="sub">4 tracked · checked 6 min ago</span></div>
<div class="filters">
  <button class="chip on">Buy zone first</button><button class="chip">All</button>
  <button class="chip">Near target</button><button class="chip">Recently dropped</button>
</div>
<div class="cards" id="cards"></div>
<div class="foot">Tap any card to expand · prototype with sample data</div>
<script>
(function(){
const D=[
 {n:"Sony WH-1000XM5 Wireless Headphones",s:"Amazon · fulfilled by Amazon",p:24990,lo:24990,hi:34990,med:29900,tgt:26000,sc:100,st:"go",
  r:[["Lowest price EVER recorded (₹24,990)",0],["18.4% below the lifetime average",0]],seed:7},
 {n:"Gillette Series 5 All-in-One Trimmer (Braun)",s:"Kay Kay Overseas · third-party seller",p:3359,lo:2799,hi:3999,med:3308,tgt:2850,sc:53,st:"",
  r:[["Mid-range — 53rd percentile of lifetime span",1],["Caution: third-party seller, not Amazon-fulfilled",1]],seed:3},
 {n:"Apple AirPods Pro (2nd gen, USB-C)",s:"Amazon · fulfilled by Amazon",p:19900,lo:17900,hi:26900,med:21400,tgt:null,sc:78,st:"watch",
  r:[["Within 12% of the all-time low (₹17,900)",1],["Trending down over the last 3 weeks",1]],seed:11},
 {n:"Logitech MX Master 3S Mouse",s:"Amazon · fulfilled by Amazon",p:8495,lo:6995,hi:10995,med:8900,tgt:7200,sc:62,st:"",
  r:[["Below the 180-day median, above the annual floor",1]],seed:5}];
const R=s=>{let x=Math.sin(s)*10000;return x-Math.floor(x)};
function series(d,n,seed){const o=[];let v=(d.hi+d.lo)/2;
 for(let i=0;i<n;i++){v+=(R(seed+i*1.7)-.48)*(d.hi-d.lo)*.075;
  if(R(seed+i*3.1)>.94)v-=(d.hi-d.lo)*.16;
  v=Math.max(d.lo,Math.min(d.hi,v));o.push(v)}
 o[o.length-1]=d.p;return o}
function path(v,w,h){const mn=Math.min(...v),mx=Math.max(...v),sp=mx-mn||1;
 return v.map((p,i)=>(i?'L':'M')+(i/(v.length-1)*w).toFixed(1)+','+(h-(p-mn)/sp*h).toFixed(1)).join(' ')}
const F=n=>'₹'+n.toLocaleString('en-IN');
document.getElementById('cards').innerHTML=D.map((d,i)=>{
 const pos=((d.hi-d.p)/(d.hi-d.lo)*100).toFixed(0);
 return `<div class="card ${d.st}" data-i="${i}">
  <div class="head">
   <div class="rail"></div>
   <div><div class="nm">${d.n}</div><div class="sub2">${d.s}</div></div>
   <div class="meter"><div class="bar"><div class="fill" style="width:${d.sc}%"></div></div>
    <div class="mlabel">${d.sc} / 100</div></div>
   <div class="pricewrap"><div class="price num">${F(d.p)}</div>
    <div class="delta num">${d.p<=d.lo?'at all-time low':pos+'% below peak'}</div></div>
  </div>
  <div class="body"><div class="inner">
   <div class="ranges">${['1M','3M','6M','1Y','All'].map((r,j)=>`<button class="r ${j==2?'on':''}" data-c="${i}" data-r="${j}">${r}</button>`).join('')}</div>
   <svg class="chart" id="sv${i}" viewBox="0 0 600 132" preserveAspectRatio="none"></svg>
   <div class="stats">
    <div class="st"><div class="stl">All-time low</div><div class="stv num go">${F(d.lo)}</div></div>
    <div class="st"><div class="stl">Median</div><div class="stv num">${F(d.med)}</div></div>
    <div class="st"><div class="stl">All-time high</div><div class="stv num">${F(d.hi)}</div></div>
    <div class="st"><div class="stl">Your target</div><div class="stv num">${d.tgt?F(d.tgt):'—'}</div></div>
   </div>
   <div class="why">${d.r.map(x=>`<div class="rsn"><span class="dot ${x[1]?'w':''}"></span><span>${x[0]}</span></div>`).join('')}</div>
   <div class="acts"><div class="btn p">Open on Amazon</div><div class="btn">Edit target</div><div class="btn">Pause alerts</div></div>
  </div></div></div>`}).join('');
const PTS=[30,90,180,365,540];
function draw(i,ri){const d=D[i],v=series(d,PTS[ri],d.seed),w=600,h=118,
 mn=Math.min(...v),mx=Math.max(...v),sp=mx-mn||1,
 y=p=>h-(p-mn)/sp*h, col=d.st==='go'?'#3FB950':d.st==='watch'?'#D29922':'#4B85D6';
 document.getElementById('sv'+i).innerHTML=
  `<defs><linearGradient id="g${i}" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0" stop-color="${col}" stop-opacity=".22"/><stop offset="1" stop-color="${col}" stop-opacity="0"/></linearGradient></defs>
   <line x1="0" y1="${y(d.lo).toFixed(1)}" x2="600" y2="${y(d.lo).toFixed(1)}" stroke="#3FB950" stroke-width="1" stroke-dasharray="3 4" opacity=".5"/>
   <text x="4" y="${(y(d.lo)-5).toFixed(1)}" fill="#3FB950" font-size="9.5" opacity=".85">all-time low ${F(d.lo)}</text>
   ${d.tgt?`<line x1="0" y1="${y(d.tgt).toFixed(1)}" x2="600" y2="${y(d.tgt).toFixed(1)}" stroke="#8B93A1" stroke-width="1" stroke-dasharray="2 4" opacity=".45"/>
   <text x="4" y="${(y(d.tgt)-5).toFixed(1)}" fill="#8B93A1" font-size="9.5" opacity=".8">your target ${F(d.tgt)}</text>`:''}
   <path d="${path(v,w,h)} L600,${h} L0,${h} Z" fill="url(#g${i})"/>
   <path d="${path(v,w,h)}" fill="none" stroke="${col}" stroke-width="1.9" stroke-linejoin="round"/>
   <circle cx="600" cy="${y(d.p).toFixed(1)}" r="3.6" fill="${col}"/>`}
document.getElementById('cards').addEventListener('click',e=>{
 const r=e.target.closest('.r');
 if(r){e.stopPropagation();const c=+r.dataset.c;
  r.parentNode.querySelectorAll('.r').forEach(x=>x.classList.remove('on'));r.classList.add('on');draw(c,+r.dataset.r);return}
 if(e.target.closest('.btn')){e.stopPropagation();return}
 const h=e.target.closest('.head');if(!h)return;
 const card=h.parentNode,i=+card.dataset.i,was=card.classList.contains('open');
 document.querySelectorAll('.card').forEach(c=>c.classList.remove('open'));
 if(!was){card.classList.add('open');draw(i,2)}
});
document.querySelectorAll('.chip').forEach(c=>c.addEventListener('click',()=>{
 document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));c.classList.add('on')}));
})();
</script>
</body>
</html>
