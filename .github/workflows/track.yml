name: Price Sentinel

on:
  schedule:
    - cron: "*/30 * * * *"     # every 30 minutes, UTC
  workflow_dispatch:
    inputs:
      force_all:
        description: "Check every product, ignoring tier cadence"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: price-sentinel
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run tracker
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          FORCE_ALL: ${{ inputs.force_all && '1' || '0' }}
        run: python main.py

      - name: Commit history
        run: |
          git config user.name "price-sentinel[bot]"
          git config user.email "price-sentinel@users.noreply.github.com"
          git add data docs
          git diff --staged --quiet || git commit -m "data: $(date -u '+%Y-%m-%d %H:%M') UTC"
          git pull --rebase --autostash origin ${{ github.ref_name }} || true
          git push
