name: Price Sentinel

on:
  schedule:
    # GitHub queues scheduled workflows behind everyone else's and drops ticks
    # under load, worst of all on :00/:15/:30/:45 where most crons pile up. The
    # old */30 landed on the two busiest minutes of the hour and delivered ~14
    # runs a day instead of 48. Ask roughly every 10 minutes on off-peak minutes
    # instead: whatever GitHub grants, the tier cadence in main.py is still the
    # real rate limiter, and a tick with nothing due exits before any network
    # call or commit.
    - cron: "3,13,23,33,43,53 * * * *"
  workflow_dispatch:
    inputs:
      force_all:
        description: "Check every product, ignoring tier cadence"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: price-sentinel
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Run tracker
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          FORCE_ALL: ${{ inputs.force_all && '1' || '0' }}
        run: python main.py

      - name: Commit history
        if: ${{ !cancelled() }}
        run: |
          git config user.name "price-sentinel[bot]"
          git config user.email "price-sentinel@users.noreply.github.com"
          git add data docs watchlist.json
          if git diff --staged --quiet; then
            echo "No tracking changes to commit."
            exit 0
          fi
          git commit -m "data: $(date -u '+%Y-%m-%d %H:%M') UTC"
          git pull --rebase --autostash origin ${{ github.ref_name }}
          git push

      - name: Run tests
        if: ${{ !cancelled() }}
        run: python -m pytest tests -q
